name: Build and Push Image

on:
  push:
    branches: [ dev ]

env:
  IMAGE_NAME: lab302

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get Azure Container Registry Name
      run: echo ${{ secrets.ACR_NAME }}

    - name: Validate ACR exists
      run: az acr show --name ${{ secrets.ACR_NAME }} -o table

    - name: Login to ACR
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build and Push Image
      run: |
        TAG=1.0.${{ github.run_number }}
        ACR_LOGIN_SERVER=$(az acr show \
          --name ${{ secrets.ACR_NAME }} \
          --query loginServer -o tsv)

        docker build -t $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$TAG .
        docker push $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$TAG
