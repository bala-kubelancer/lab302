name: Build and Push Image

on:
  push:
    branches: [ dev ]

env:
  IMAGE_NAME: lab302

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get Azure Container Registry Name
      run: echo ${{ secrets.ACR_NAME }}

    - name: Validate ACR exists
      run: az acr show --name lab302acr -o table

    - name: Login to ACR
      run: az acr login --name lab302acr

    - name: Build and Push Image
      run: |
        TAG=1.0.${{ github.run_number }}
        docker build -t lab302acr.azurecr.io/${{ env.IMAGE_NAME }}:$TAG .
        docker push lab302acr.azurecr.io/${{ env.IMAGE_NAME }}:$TAG
