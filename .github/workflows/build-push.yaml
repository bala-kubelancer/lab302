name: Build and Push Image

on:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: lab302
  ACR_NAME: lab302acr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: 3a866bfe-0cd1-464a-a784-3af1265e5109   # APP_ID
        tenant-id: ad3833bf-7795-489c-ad0f-7e74c84175cd  # TENANT_ID
        subscription-id: 3f04442e-237f-4b01-91f3-f567b7fc39b3 # SUBSCRIPTION_ID

    - name: Validate ACR
      run: az acr show --name $ACR_NAME -o table

    - name: Login to ACR
      run: az acr login --name $ACR_NAME

    - name: Build & Push
      run: |
        TAG=1.0.${{ github.run_number }}
        ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
        docker build -t $ACR_LOGIN_SERVER/${IMAGE_NAME}:$TAG .
        docker push $ACR_LOGIN_SERVER/${IMAGE_NAME}:$TAG
