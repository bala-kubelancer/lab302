name: Build and Push Image

on:
  push:
    branches: [ dev ]

env:
  IMAGE_NAME: lab302

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Azure Subscription
      run: az account set --subscription 3f04442e-237f-4b01-91f3-f567b7fc39b3

    - name: Login to ACR
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: List ACRs (debug)
      run: az acr list --query "[].{Name:name, RG:resourceGroup}" -o table

    - name: Build and Push Image
      run: |
        TAG=1.0.${{ github.run_number }}
        ACR_LOGIN_SERVER=$(az acr show \
          --name ${{ secrets.ACR_NAME }} \
          --query loginServer -o tsv)

        docker build -t $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$TAG .
        docker push $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$TAG
