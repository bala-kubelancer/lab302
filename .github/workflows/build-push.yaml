name: Build and Push Image

on:
  push:
    branches: [ dev ]

env:
  IMAGE_NAME: lab302

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - run: |
        TAG=1.0.${{ github.run_number }}
        ACR=$(az acr show --resource-group lab302rg --name lab302acr --query loginServer -o tsv)
        docker build -t $ACR/${{ env.IMAGE_NAME }}:$TAG .
        docker push $ACR/${{ env.IMAGE_NAME }}:$TAG
