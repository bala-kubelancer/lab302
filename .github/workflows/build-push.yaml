name: Build and Push Image

on:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: lab302
  ACR_NAME: lab302acr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: 1c00fe9d-0a97-436e-9590-4b9d9b25f321
        tenant-id: ad3833bf-7795-489c-ad0f-7e74c84175cd
        subscription-id: 3f04442e-237f-4b01-91f3-f567b7fc39b3

    - name: Debug identity 
      run: |
        az account show
        az acr list -o table

    - name: Login to ACR
      run: az acr login --name $ACR_NAME

    - name: Build & Push
      run: |
        TAG=1.0.${{ github.run_number }}
        ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
        docker build -t $ACR_LOGIN_SERVER/${IMAGE_NAME}:$TAG app/v1/.
        docker push $ACR_LOGIN_SERVER/${IMAGE_NAME}:$TAG
