apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab302
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: lab302=lab302acr.azurecr.io/lab302
    argocd-image-updater.argoproj.io/lab302.update-strategy: newest-build
    argocd-image-updater.argoproj.io/lab302.allow-tags: regexp:^1\.0\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: dev
spec:
  project: default
  source:
    repoURL: https://github.com/bala-kubelancer/lab302.git
    targetRevision: dev
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
